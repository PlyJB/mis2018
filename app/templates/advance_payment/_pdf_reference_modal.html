<div class="modal fade" id="pdfReferenceModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-start">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">ข้อมูลสำหรับส่งออก PDF</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="ปิด"></button>
      </div>
      <form method="post" action="{{ pdf_export_url }}" target="_blank">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="modal-body">
          <p class="text-muted small">ระบบจะจำค่าที่บันทึกไว้ และเปิดให้ตรวจสอบหรือแก้ไขได้ทุกครั้งก่อนส่งออก</p>
          <div class="mb-3">
            <label class="form-label fw-bold">เลขที่หนังสือ</label>
            <input class="form-control" name="reference_number" required value="{{ document.reference_number or '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">วันที่หนังสือ</label>
            <input type="date" class="form-control" name="reference_date" required value="{{ document.reference_date.strftime('%Y-%m-%d') if document.reference_date else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">ผลผลิต</label>
            <select class="form-select searchable-select" name="product_code_id" required>
              <option value="">เลือกผลผลิต</option>
              {% for item in pdf_reference_options.product_codes %}
              <option value="{{ item.id }}" {% if document.product_code_id == item.id %}selected{% endif %}>{{ item.id }} - {{ item.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">รหัสศูนย์ต้นทุน</label>
            <select class="form-select searchable-select" name="cost_center_id" required>
              <option value="">เลือกศูนย์ต้นทุน</option>
              {% for item in pdf_reference_options.cost_centers %}
              <option value="{{ item.id }}" {% if document.cost_center_id == item.id %}selected{% endif %}>{{ item.id }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
<!--            <label class="form-label fw-bold">รหัสใบสั่งงานภายใน</label>-->
            <label class="form-label fw-bold">เลือกโครงการ</label>
            <select class="form-select searchable-select" name="iocode_id" required>
              <option value="">เลือก IO Code</option>
              {% for item in pdf_reference_options.iocodes %}
              <option value="{{ item.id }}" {% if document.iocode_id == item.id %}selected{% endif %}>{{ item.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="submit" class="btn btn-dark fw-bold">บันทึกและดาวน์โหลด PDF</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const modal = document.getElementById('pdfReferenceModal');
    if (!modal || typeof $ === 'undefined' || !$.fn.select2) return;

    $(modal).find('.searchable-select').select2({
      theme: 'bootstrap-5',
      placeholder: 'พิมพ์เพื่อค้นหาหรือเลือกข้อมูล...',
      allowClear: true,
      width: '100%',
      dropdownParent: $(modal)
    });
  });
</script>
